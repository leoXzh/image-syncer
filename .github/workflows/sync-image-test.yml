name: Sync Docker Image to Aliyun

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Git pull
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login in Docker Hub
      uses: docker/login-action@v3
      with:
        registry: registry.cn-hangzhou.aliyuncs.com
        username: 美守安
        password: Shit-123
        logout: false

    - name: Use Skopeo Tools Sync Docker Image from Docker Hub
      run: skopeo copy docker://docker.io/postgres@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15 docker://registry.cn-hangzhou.aliyuncs.com/msig/postgres:18.4-alpine
